<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 245" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Shield Frame -->
    <linearGradient id="nfsuGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9B464" />
      <stop offset="35%" stop-color="#C59E47" />
      <stop offset="70%" stop-color="#DEBE74" />
      <stop offset="100%" stop-color="#B28935" />
    </linearGradient>

    <linearGradient id="nfsuGoldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EED596" />
      <stop offset="50%" stop-color="#B88E35" />
      <stop offset="100%" stop-color="#8F6A1E" />
    </linearGradient>

    <!-- Inner Shield Clip Path -->
    <clipPath id="innerShieldClip">
      <path d="M 32,60 L 168,60 L 168,140 Q 168,172 100,198 Q 32,172 32,140 Z" />
    </clipPath>
  </defs>

  <!-- Top Architectural Battlements (NFSU Bhavan Architecture) -->
  <g fill="url(#nfsuGoldGrad)" stroke="#8F6A1E" stroke-width="1">
    <!-- Center Battlement Tower -->
    <rect x="91" y="2" width="18" height="22" rx="1.5" />
    <!-- Left Battlement Tower -->
    <rect x="36" y="9" width="16" height="17" rx="1.5" />
    <!-- Right Battlement Tower -->
    <rect x="148" y="9" width="16" height="17" rx="1.5" />
  </g>

  <!-- Main Shield Body Outer -->
  <path
    d="M 22,22 
       L 178,22 
       L 178,144 
       Q 178,186 100,224 
       Q 22,186 22,144 
       Z"
    fill="url(#nfsuGoldGrad)"
    stroke="url(#nfsuGoldBorder)"
    stroke-width="3"
    filter="drop-shadow(0 2px 4px rgba(0,0,0,0.18))"
  />

  <!-- Top "NFSU" Typography Header -->
  <text
    x="100"
    y="51"
    text-anchor="middle"
    font-family="'Times New Roman', 'Georgia', serif"
    font-size="28"
    font-weight="900"
    letter-spacing="2"
    fill="#15244C"
  >NFSU</text>

  <!-- Inner Quadrants Area -->
  <g clip-path="url(#innerShieldClip)">
    <!-- Quadrant 1: Top-Left (Navy Blue) -->
    <rect x="30" y="58" width="70" height="66" fill="#182855" />

    <!-- Quadrant 2: Top-Right (Deep Crimson Red) -->
    <rect x="100" y="58" width="70" height="66" fill="#A31D24" />

    <!-- Quadrant 3: Bottom-Left (Deep Crimson Red) -->
    <rect x="30" y="124" width="70" height="80" fill="#A31D24" />

    <!-- Quadrant 4: Bottom-Right (Navy Blue) -->
    <rect x="100" y="124" width="70" height="80" fill="#182855" />

    <!-- Subtle quadrant borders / grid lines -->
    <line x1="100" y1="58" x2="100" y2="200" stroke="#CCA04D" stroke-width="2.5" />
    <line x1="30" y1="124" x2="170" y2="124" stroke="#CCA04D" stroke-width="2.5" />

    <!-- 1. Digital Forensics: Computer Monitor with Magnifier -->
    <g transform="translate(65, 91)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Monitor Frame -->
      <rect x="-18" y="-14" width="36" height="23" rx="2" stroke-width="2.2" />
      <!-- Stand and Base -->
      <line x1="0" y1="9" x2="0" y2="15" stroke-width="2.2" />
      <line x1="-10" y1="15" x2="10" y2="15" stroke-width="2.2" />
      <!-- Magnifying Glass Inside Monitor -->
      <circle cx="-1" cy="-2.5" r="5" stroke-width="1.8" />
      <line x1="2.5" y1="1" x2="6.5" y2="5" stroke-width="2.2" />
    </g>

    <!-- 2. Fingerprint Science: Concentric Ridge Loops -->
    <g transform="translate(135, 91)" stroke="#FFFFFF" fill="none" stroke-linecap="round">
      <!-- Innermost Loop -->
      <path d="M -1,8 C -3,4 -3,-3 -0.5,-6 C 2,-3 2,4 0.5,8" stroke-width="1.8" />
      <!-- Mid-Inner Ridge -->
      <path d="M -5,11 C -8,5 -7,-7 0,-10 C 7,-7 7.5,5 4,11" stroke-width="1.8" />
      <!-- Mid Ridge -->
      <path d="M -9,13 C -13,6 -12,-11 0,-14 C 11.5,-11 12,6 8,13" stroke-width="1.8" />
      <!-- Outer Ridge -->
      <path d="M -13,15 C -17,5 -15,-15 0,-18 C 15,-15 16,5 12,15" stroke-width="1.8" />
      <!-- Core Deltoid Base Marks -->
      <path d="M -8,15 Q -1,13 0,10 Q 1,13 8,15" stroke-width="1.5" />
    </g>

    <!-- 3. Forensic Science: Laboratory Microscope -->
    <g transform="translate(65, 156)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Angled Eyepiece Tube -->
      <line x1="-6" y1="-18" x2="3" y2="-2" stroke-width="2.6" />
      <!-- Eyepiece Top -->
      <line x1="-9" y1="-19.5" x2="-3" y2="-16" stroke-width="2.6" />
      <!-- Objective Lens assembly -->
      <line x1="3" y1="-2" x2="5" y2="3" stroke-width="2.4" />
      <line x1="5" y1="3" x2="6.5" y2="7" stroke-width="2" />
      <!-- Stage -->
      <line x1="-11" y1="7.5" x2="11" y2="7.5" stroke-width="2.6" />
      <!-- Curved Limb / Arm -->
      <path d="M -2,-8 C -14,-7 -15,7 -7,14 L 5,14" stroke-width="2.2" />
      <!-- Base -->
      <path d="M -14,18 C -14,15 14,15 14,18 Z" fill="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- 4. Forensic DNA / Genetics: Double Helix -->
    <g transform="translate(135, 156)" stroke="#FFFFFF" fill="none" stroke-linecap="round">
      <!-- Strand 1 Sine Wave -->
      <path d="M -8,-18 C 12,-9 12,0 -8,9 C 12,18 12,23 -4,25" stroke-width="2.4" />
      <!-- Strand 2 Sine Wave -->
      <path d="M 8,-18 C -12,-9 -12,0 8,9 C -12,18 -12,23 4,25" stroke-width="2.4" />
      <!-- Base Pair Rungs -->
      <line x1="-5.5" y1="-14" x2="5.5" y2="-14" stroke-width="2" />
      <line x1="-6.5" y1="-9" x2="6.5" y2="-9" stroke-width="2" />
      <line x1="-2" y1="-4.5" x2="2" y2="-4.5" stroke-width="2" />
      <line x1="-2" y1="4.5" x2="2" y2="4.5" stroke-width="2" />
      <line x1="-6.5" y1="9" x2="6.5" y2="9" stroke-width="2" />
      <line x1="-5.5" y1="14" x2="5.5" y2="14" stroke-width="2" />
      <line x1="-3" y1="19" x2="3" y2="19" stroke-width="2" />
    </g>
  </g>

  <!-- Inner Golden Shield Inset Frame -->
  <path
    d="M 32,60 L 168,60 L 168,140 Q 168,172 100,198 Q 32,172 32,140 Z"
    fill="none"
    stroke="#8F6A1E"
    stroke-width="1.8"
  />

  <!-- Bottom Sanskrit Motto Banner -->
  <g>
    <!-- Motto Text: विद्ययाऽमृतमश्नुते -->
    <text
      x="100"
      y="216"
      text-anchor="middle"
      font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI Historic', 'Siddhanta', serif"
      font-size="11"
      font-weight="800"
      fill="#1A1815"
      letter-spacing="0.5"
    >विद्ययाऽमृतमश्नुते</text>
  </g>
</svg>
